apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.connector.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anyscale-connector.labels" . | nindent 4 }}
  {{- with .Values.connector.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
