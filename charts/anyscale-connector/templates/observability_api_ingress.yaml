{{- if and .Values.observabilityApi.enabled .Values.observabilityApi.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "anyscale-connector.observabilityApi.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anyscale-connector.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.observabilityApi.ingress.className }}
  tls:
    - hosts:
        - {{ include "anyscale-connector.observabilityApi.host" . | quote }}
      secretName: {{ include "anyscale-connector.observabilityApi.tlsSecretName" . | quote }}
  rules:
    - host: {{ include "anyscale-connector.observabilityApi.host" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "anyscale-connector.observabilityApi.fullname" . }}
                port:
                  name: web
{{- end }}
