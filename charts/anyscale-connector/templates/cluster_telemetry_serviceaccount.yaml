{{- if .Values.clusterTelemetry.enabled }}
# The Cluster Telemetry Gateway's own ServiceAccount, kept separate from the connector's so
# each identity carries only its own permissions.
#
# Anyscale authorizes the gateway's telemetry egress by the namespace this account lives in,
# not by its name, so a separate account in the release namespace needs no extra registration.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "anyscale-connector.clusterTelemetry.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anyscale-connector.labels" . | nindent 4 }}
  {{- with .Values.clusterTelemetry.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
