{{- if .Values.webhook.manageCerts }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # Namespace suffix supports multiple installs in one cluster without collision.
  name: kuberay-telemetry-injector-{{ .Release.Namespace }}
  labels:
    {{- include "anyscale-connector.labels" . | nindent 4 }}
rules:
  # Keeps the webhook caBundle in sync with the rotated cert; list/watch cannot
  # be scoped to a resourceName.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "update"]
{{- end }}
