apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: anyscale-connector-workloads-{{ .Release.Namespace }}
  labels:
    {{- include "anyscale-connector.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: anyscale-connector-workloads-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.connector.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
