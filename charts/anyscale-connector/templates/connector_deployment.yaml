apiVersion: apps/v1
kind: Deployment
metadata:
  name: anyscale-connector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anyscale-connector.labels" . | nindent 4 }}
spec:
  # Must stay 1: multiple replicas would race on webhook cert rotation.
  replicas: 1
  selector:
    matchLabels:
      {{- include "anyscale-connector.connector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "anyscale-connector.podLabels" (dict "selector" (include "anyscale-connector.connector.selectorLabels" .) "labels" .Values.connector.labels "root" .) | nindent 8 }}
      {{- with include "anyscale-connector.podAnnotations" (dict "annotations" .Values.connector.annotations "root" .) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.connector.serviceAccount.name }}
      {{- if .Values.webhook.hostNetwork }}
      # On the node's network the webhook is reachable at the node's IP, for clusters whose
      # API server cannot route to pod IPs.
      hostNetwork: true
      {{- end }}
      {{- with (include "anyscale-connector.tolerations" (dict "tolerations" .Values.connector.tolerations "root" .)) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: connector
          image: {{ include "anyscale-connector.image" (dict "image" .Values.connector.image "fallbackRegistry" .Values.global.image.registry "fallbackTag" .Values.global.image.tag "tagError" "global.image.tag is required (or set connector.image.tag)") }}
          imagePullPolicy: {{ .Values.connector.image.pullPolicy }}
          args:
            {{- include "anyscale-connector.connector.coreArgs" . | nindent 12 }}
            - --connector-version={{ .Chart.Version }}
            - --log-file=/tmp/anyscale/logs/connector.log
            {{- with .Values.connector.metricsHost }}
            - --metrics-host={{ . }}
            {{- end }}
            {{- with .Values.connector.logsHost }}
            - --logs-host={{ . }}
            {{- end }}
            - --webhook-port={{ .Values.webhook.port }}
            - --health-port={{ .Values.connector.healthPort }}
            - --metrics-server-port={{ .Values.connector.metricsPort }}
            - --cert-dir=/etc/webhook/tls
            - --webhook-service-name=kuberay-telemetry-injector
            - --mutating-webhook-config-name=kuberay-telemetry-injector-{{ .Release.Namespace }}
            - --cert-secret-name=kuberay-telemetry-injector-certs
            - --manage-certs={{ .Values.webhook.manageCerts }}
            {{- with include "anyscale-connector.workloadIngressClassName" . }}
            - --default-ingress-class-name={{ . }}
            {{- end }}
            {{- with include "anyscale-connector.connector.telemetryArgs" . }}
            {{- . | nindent 12 }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.connector.healthPort }}
              protocol: TCP
          # Probes hit the plain-HTTP health port, not the TLS webhook port, so they
          # stay green while the serving cert is being provisioned. Readiness (/readyz)
          # gates admission traffic on the cert being ready; liveness (/healthz) only
          # tracks the process, so cert bootstrap never triggers a restart.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.connector.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "anyscale-connector.connector.tokenVolumeMount" . | nindent 12 }}
            - name: webhook-certs
              mountPath: /etc/webhook/tls
              readOnly: true
            # Shared with the Vector sidecar: the connector writes logs here, Vector tails them.
            - name: logs
              mountPath: /tmp/anyscale/logs/
            # Socket dir for the telemetry forwarders (one socket per listener port).
            - name: forwarder-egress
              mountPath: /tmp/forwarder/
        # Vector sidecar: tails the connector's log file and scrapes its /metrics, then
        # pushes both to the connector's forwarders, which ship them to Anyscale. This is
        # the connector's own operational telemetry -- unrelated to the Ray workload
        # telemetry the injector webhook configures.
        - name: vector
          image: {{ include "anyscale-connector.image" (dict "image" .Values.vector.image "fallbackRegistry" .Values.global.image.registry "tagError" "vector.image.tag is required") }}
          imagePullPolicy: {{ .Values.vector.image.pullPolicy }}
          command: ["/usr/bin/vector"]
          args:
            - --config-yaml
            - /etc/vector/vector.yaml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Vector 0.57 skips ${VAR} interpolation in config files by default, and
            # logs nothing when it does, so the config's ${POD_NAME}/${POD_NAMESPACE}
            # tags would ship as literal text. Remove once the config drops ${VAR}.
            - name: VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION
              value: "true"
          {{- with .Values.connector.vector.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: logs
              mountPath: /tmp/anyscale/logs/
              readOnly: true
            - name: vector-config
              mountPath: /etc/vector/
              readOnly: true
            - name: vector-state
              mountPath: /tmp/vector
      volumes:
        {{- include "anyscale-connector.connector.tokenVolume" . | nindent 8 }}
        - name: logs
          emptyDir: {}
        - name: forwarder-egress
          emptyDir: {}
        - name: vector-config
          configMap:
            name: connector-vector
        - name: vector-state
          emptyDir: {}
        - name: webhook-certs
          {{- if .Values.webhook.manageCerts }}
          # The rotator writes the serving cert to this Secret via the API and then waits for it
          # to appear on disk -- it never writes CertDir itself -- so CertDir must be a projection
          # of the Secret. optional: true because the Secret starts out empty (see
          # injector_cert_secret.yaml); kubelet fills it in once the rotator populates it.
          secret:
            secretName: kuberay-telemetry-injector-certs
            optional: true
          {{- else }}
          # Operator-provided TLS Secret.
          secret:
            secretName: {{ required "webhook.certSecretName is required when webhook.manageCerts=false" .Values.webhook.certSecretName }}
          {{- end }}
