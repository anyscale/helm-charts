{{- if .Values.observabilityApi.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "anyscale-connector.observabilityApi.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anyscale-connector.labels" . | nindent 4 }}
  {{- with .Values.observabilityApi.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
