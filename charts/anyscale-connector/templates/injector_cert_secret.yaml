{{- if .Values.webhook.manageCerts }}
apiVersion: v1
kind: Secret
metadata:
  name: kuberay-telemetry-injector-certs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anyscale-connector.labels" . | nindent 4 }}
# Created empty; the in-cluster cert rotator populates tls.crt/tls.key/ca.crt at startup.
type: Opaque
{{- end }}
