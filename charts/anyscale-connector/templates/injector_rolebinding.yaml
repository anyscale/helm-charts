{{- if .Values.webhook.manageCerts }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kuberay-telemetry-injector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anyscale-connector.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kuberay-telemetry-injector
subjects:
  - kind: ServiceAccount
    name: {{ .Values.connector.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
