apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: anyscale-connector-telemetry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anyscale-connector.labels" . | nindent 4 }}
rules:
  {{- include "anyscale-connector.connector.configMapRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anyscale-connector-telemetry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anyscale-connector.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: anyscale-connector-telemetry
subjects:
  - kind: ServiceAccount
    name: {{ .Values.connector.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
