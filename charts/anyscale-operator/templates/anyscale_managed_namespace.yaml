{{- if .Values.workloads.managedNamespaces }}
{{- /* Renders alongside discoverManagedNamespaces on purpose: the operator compares
     this list with the labelled namespaces at startup and refuses to start if they
     differ, so a migration can prove parity before the list is emptied. */}}
{{- range .Values.workloads.managedNamespaces }}
{{- include "anyscale-operator.validateNamespaceName" (dict "field" "workloads.managedNamespaces" "value" .) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: anyscale-managed-namespaces
  namespace: {{ .Release.Namespace }}
  labels:
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  namespaces.yaml: |-
{{ toYaml .Values.workloads.managedNamespaces | indent 4 }}
{{- end }}
