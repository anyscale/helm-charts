{{- /*
One ServiceAccount per namespace a workload pod can land in: the pod patch sets
serviceAccountName everywhere, and the operator's namespace sync copies Secrets only.
*/ -}}
{{- if .Values.workloads.serviceAccount.create }}
{{- $name := required "workloads.serviceAccount.name is required when workloads.serviceAccount.create is true" .Values.workloads.serviceAccount.name }}
{{- $namespaces := prepend (without (uniq (.Values.workloads.managedNamespaces | default list)) .Release.Namespace "") .Release.Namespace }}
{{- range $ns := $namespaces }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    helm.sh/chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "_" }}
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  {{- with $.Values.workloads.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
