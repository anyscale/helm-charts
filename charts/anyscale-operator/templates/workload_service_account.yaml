{{- /*
The pod patch in configmap_patches.yaml points every workload pod at
workloads.serviceAccount.name regardless of namespace, and a ServiceAccount is
namespace-scoped, so render one per namespace a pod can land in. The operator's
namespace sync copies Secrets only, so it cannot fan this out for us.
*/ -}}
{{- if .Values.workloads.serviceAccount.create }}
{{- $name := required "workloads.serviceAccount.name is required when workloads.serviceAccount.create is true" .Values.workloads.serviceAccount.name }}
{{- $namespaces := prepend (without (uniq (.Values.workloads.managedNamespaces | default list)) .Release.Namespace "") .Release.Namespace }}
{{- range $ns := $namespaces }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    helm.sh/chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "_" }}
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  {{- with $.Values.workloads.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
