apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # Since this is a global resource, we append the namespace to it to support
  # launching multiple cloud deployments into a single Kubernetes cluster (we
  # assume that clouds to not share namespaces).
  name: anyscale-operator-token-reviewer-{{ .Release.Namespace }}
  labels:
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events", "nodes"]
    verbs: ["get", "watch", "list"]
{{- if .Values.workloads.discoverManagedNamespaces }}
  # Discovery lists Namespaces by label. Namespaces are cluster-scoped, so only
  # this cluster-bound role can grant it.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "watch", "list"]
{{- end }}
{{- if and .Values.workloads.enableCrossNamespaceResourceManagement (not .Values.workloads.createPerNamespaceRoleBindings) }}
# Cross-namespace resource management with a cluster-wide grant: this
# ClusterRole is cluster-bound, so the workload rules here apply to all
# namespaces. With createPerNamespaceRoleBindings the same rules are granted
# per managed namespace instead (workload_cluster_role.yaml).
{{- include "anyscale-operator.rbac-rules" . }}
{{- end }}
