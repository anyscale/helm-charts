{{- if .Values.workloads.dcgmExporter.namespace }}
{{- include "anyscale-operator.validateNamespaceName" (dict "field" "workloads.dcgmExporter.namespace" "value" .Values.workloads.dcgmExporter.namespace) }}
# Lets each GPU workload pod find the dcgm-exporter pod on its own node: anyscaled lists
# the exporter Service's EndpointSlices and proxies that endpoint onto localhost:9400 for
# the DCGM scrape. Binds the service-account group of the release namespace and of each
# `workloads.managedNamespaces` entry; a namespace found by `discoverManagedNamespaces`
# needs a manual RoleBinding (see the README), or GPU pods there answer 503 on
# localhost:9400 and report no DCGM metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  # Release-namespace suffix: two operator releases can share one exporter namespace.
  name: anyscale-workload-dcgm-exporter-reader-{{ .Release.Namespace }}
  namespace: {{ .Values.workloads.dcgmExporter.namespace }}
  labels:
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anyscale-workload-dcgm-exporter-reader-{{ .Release.Namespace }}
  namespace: {{ .Values.workloads.dcgmExporter.namespace }}
  labels:
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: anyscale-workload-dcgm-exporter-reader-{{ .Release.Namespace }}
subjects:
  - kind: Group
    name: system:serviceaccounts:{{ .Release.Namespace }}
    apiGroup: rbac.authorization.k8s.io
{{- range .Values.workloads.managedNamespaces }}
  - kind: Group
    name: system:serviceaccounts:{{ . }}
    apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
